<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Czech Syntax Trainer</title>
<style>
  :root {
    --bg: #05060a; --ink: #1a1a1a; --muted: #6b6b6b; --line: #d8d8d4;
    --accent: #2b5cff;
    --good: #1a9c4a; --bad: #d63a3a; --warn: #b8860b;
    --label-bg: #dff2d3;
    --label-ink: #1f5c14;
    --label-border: #7fbb6a;
    --label-hover-bg: #c8e9b3;
    --label-selected-bg: #4f9e3d;
    --label-selected-ink: #ffffff;
    --case-bg: #eaf2ff;
    --case-border: #8fb4e8;
    --case-ink: #1a3d70;

    --on-bg: #ffffff;
    --on-bg-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 1px rgba(0,0,0,0.9);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    margin: 0; padding: 20px 16px 64px; line-height: 1.5;

    background-image:
      linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
      url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-color: var(--bg);
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  h1 { font-size: 2rem; margin: 0 0 6px; color: var(--on-bg); text-shadow: var(--on-bg-shadow); }
  .sub { color: var(--on-bg); font-size: 1.05rem; margin-bottom: 18px; text-shadow: var(--on-bg-shadow); }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 16px;
  }
  .topbar .group { display: flex; align-items: center; gap: 8px; }
  .topbar .group > label { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .mode-btn {
    font: inherit; padding: 6px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer; font-weight: 600; font-size: .9rem;
  }
  .mode-btn:hover { border-color: var(--accent); }
  .mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .level-select {
    font: inherit; padding: 6px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; font-weight: 600;
    min-width: 180px;
  }

  .welcome { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
  .welcome h2 { margin-top: 0; }
  .welcome h3 { margin-bottom: 4px; margin-top: 16px; font-size: 1rem; }
  .welcome ul { margin: 4px 0 0; padding-left: 20px; }
  .welcome code { background: #eef2ff; padding: 1px 6px; border-radius: 4px; font-weight: 600; color: var(--accent); }
  .welcome .big { font-size: 1.05rem; color: var(--accent); font-weight: 600; }

  .explain {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; font-size: .92rem; margin-bottom: 16px;
  }
  .explain b { color: var(--accent); }
  .explain code { background: #eef2ff; padding: 1px 6px; border-radius: 4px; font-weight: 600; color: var(--accent); }

  .status {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 1rem; color: var(--on-bg); margin-bottom: 10px;
    text-shadow: var(--on-bg-shadow);
  }
  .score { font-weight: 700; color: var(--on-bg); }
  .score.negative { color: #ff8a8a; }

  .labels { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .label {
    background: var(--label-bg); border: 2px solid var(--label-border); color: var(--label-ink);
    border-radius: 8px; padding: 6px 12px; font-size: .9rem; font-weight: 600;
    cursor: pointer; user-select: none; transition: all .12s;
  }
  .label:hover { background: var(--label-hover-bg); }
  .label.selected { background: var(--label-selected-bg); color: var(--label-selected-ink); border-color: var(--label-selected-bg); }

  .silent-box { background: #fff8e6; border: 1px solid var(--warn); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .silent-box .q { font-weight: 600; margin-bottom: 4px; color: #6b5200; }
  .silent-box .hint-text { font-size: .85rem; color: #6b5200; margin-bottom: 8px; }
  .silent-box select, .silent-box input {
    font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; min-width: 130px;
  }
  .silent-box.correct { background: #e3f6ea; border-color: var(--good); }
  .silent-box.wrong   { background: #fbe6e6; border-color: var(--bad); }
  .silent-box.correct .q, .silent-box.correct .hint-text { color: #0e5c28; }
  .silent-box.wrong   .q, .silent-box.wrong   .hint-text { color: #8a1e1e; }

  .sentence {
    display: flex; flex-wrap: wrap; gap: 3px; align-items: flex-start;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 16px; margin-bottom: 16px; min-height: 90px;
  }
  .word-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; }
  .word {
    font-size: 1.15rem; padding: 6px 3px; border-radius: 6px;
    cursor: pointer; border: 2px solid transparent; transition: all .12s;
    white-space: nowrap; word-spacing: 0.15em;
  }
  .word:hover { background: #f0f0ee; }
  .word-slot.has-label .word { background: #eaf7e1; }
  .word-slot.correct .word { background: #e3f6ea; border-color: var(--good); }
  .word-slot.wrong .word { background: #fbe6e6; border-color: var(--bad); }

  .slot-label {
    font-size: .78rem; padding: 3px 8px; border-radius: 5px;
    background: var(--label-bg); color: var(--label-ink); font-weight: 600;
    min-height: 22px; display: flex; align-items: center;
  }
  .slot-label.empty { background: transparent; color: transparent; }
  .word-slot.correct .slot-label { background: var(--good); color: #fff; }
  .word-slot.wrong .slot-label { background: var(--bad); color: #fff; }
  .correction { font-size: .78rem; color: var(--good); font-weight: 600; }

  .case-select {
    font: inherit; font-size: .72rem; font-weight: 600;
    padding: 2px 4px; border-radius: 5px;
    background: var(--case-bg); color: var(--case-ink);
    border: 1px solid var(--case-border); max-width: 160px;
  }
  .case-select.empty { background: #f4f4f4; border-color: #d0d0d0; color: #888; }
  .case-select.correct { background: #e3f6ea; border-color: var(--good); color: #0e5c28; }
  .case-select.wrong   { background: #fbe6e6; border-color: var(--bad); color: #8a1e1e; }
  .case-correction { font-size: .7rem; color: var(--good); font-weight: 600; }

  .slot-input {
    font: inherit; font-size: .85rem; width: 60px; text-align: center;
    padding: 4px 4px; border: 2px solid var(--line); border-radius: 6px;
    background: #fafaf8; text-transform: uppercase;
  }
  .slot-input:focus { outline: none; border-color: var(--accent); }
  .word-slot.correct .slot-input { border-color: var(--good); background: #e3f6ea; }
  .word-slot.wrong .slot-input { border-color: var(--bad); background: #fbe6e6; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls .spacer { flex: 1 1 auto; }
  button {
    font: inherit; padding: 9px 18px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.hint { background: #fff; color: var(--warn); border: 1px solid var(--warn); }
  button.hint.spent { color: var(--muted); border-color: var(--line); }
  button.case-hint { background: #fff; color: #1a3d70; border: 1px solid #8fb4e8; }
  button.case-hint.spent { color: var(--muted); border-color: var(--line); }
  button.notes { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  button.skip { background: #fff; color: #a04040; border: 1px dashed #d63a3a; font-weight: 600; }
  button.skip:hover { background: #fdf0f0; }
  .speak { background: #fff; color: var(--ink); border: 1px solid var(--line); padding: 9px 14px; }

  .english { color: var(--on-bg); font-style: italic; margin-bottom: 14px; font-size: 1.05rem; text-shadow: var(--on-bg-shadow); }
  .notice { color: var(--on-bg); font-weight: 600; font-size: .95rem; margin-top: 8px; text-shadow: var(--on-bg-shadow); }
  .bounce { color: #ff8a8a; font-weight: 700; font-size: .95rem; margin-top: 8px; text-shadow: var(--on-bg-shadow); }

  .grammar-notes {
    background: #eef2ff; border: 1px solid var(--accent); border-radius: 10px;
    padding: 14px 18px; margin-top: 14px; font-size: .92rem;
  }
  .grammar-notes h4 { margin: 0 0 8px; color: var(--accent); font-size: 1rem; }
  .grammar-notes p { margin: 8px 0; }
  .grammar-notes ul { margin: 6px 0; padding-left: 22px; }
  .grammar-notes code { background: #fff; padding: 1px 6px; border-radius: 4px; font-weight: 600; }

  .case-notes {
    background: #eaf2ff; border: 1px solid #8fb4e8; border-radius: 10px;
    padding: 14px 18px; margin-top: 14px; font-size: .92rem;
  }
  .case-notes h4 { margin: 0 0 8px; color: #1a3d70; font-size: 1rem; }
  .case-notes p { margin: 8px 0; }
  .case-notes ul { margin: 6px 0; padding-left: 22px; }
  .case-notes .case-line { margin: 10px 0; }
  .case-notes .case-name { font-weight: 700; color: #1a3d70; }
  .case-notes code { background: #fff; padding: 1px 6px; border-radius: 4px; font-weight: 600; }

  .role-reminder {
    background: #fff8e6; border: 1px solid var(--warn); border-radius: 10px;
    padding: 14px 18px; margin-top: 14px; font-size: .92rem;
  }
  .role-reminder h4 { margin: 0 0 8px; color: #6b5200; font-size: 1rem; }
  .role-reminder ul { margin: 6px 0; padding-left: 22px; }
  .role-reminder li { margin: 4px 0; }
  .role-reminder code { background: #fff; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .role-reminder p { margin: 8px 0; }

  .done { text-align: center; padding: 40px 20px; background: #fff; border-radius: 10px; border: 1px solid var(--line); }
  .done h2 { margin-top: 0; }
  .done .final { font-size: 2rem; font-weight: 700; margin: 12px 0; }
  .loading { color: var(--on-bg); text-align: center; padding: 40px; text-shadow: var(--on-bg-shadow); }
  .error { color: #ff8a8a; text-align: center; padding: 40px; text-shadow: var(--on-bg-shadow); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Czech Syntax Trainer</h1>
  <div class="sub">Identify the syntactic function of each unit — and its case.</div>

  <div class="topbar">
    <div class="group">
      <label>Mode:</label>
      <button class="mode-btn" data-mode="Dumb">Dumb</button>
      <button class="mode-btn" data-mode="Easy">Easy</button>
      <button class="mode-btn" data-mode="Normal">Normal</button>
    </div>
    <div class="group">
      <label for="levelSel">Choose:</label>
      <select id="levelSel" class="level-select">
        <option value="">—</option>
      </select>
    </div>
  </div>

  <div id="app"></div>
</div>

<script>
// ============================================================
// CASE DEFINITIONS
// ============================================================
const CASES = [
  { id: 1, label: "1. pád — Kdo? Co?",            short: "1. pád" },
  { id: 2, label: "2. pád — Bez koho? Bez čeho?", short: "2. pád" },
  { id: 3, label: "3. pád — Komu? Čemu?",         short: "3. pád" },
  { id: 4, label: "4. pád — Koho? Co?",           short: "4. pád" },
  { id: 5, label: "5. pád — Oslovujeme, voláme",  short: "5. pád" },
  { id: 6, label: "6. pád — O kom? O čem?",       short: "6. pád" },
  { id: 7, label: "7. pád — S kým? S čím?",       short: "7. pád" }
];

const CASE_NAME_TO_ID = {
  "nominative": 1,
  "genitive": 2,
  "dative": 3,
  "accusative": 4,
  "vocative": 5,
  "locative": 6,
  "instrumental": 7
};

function caseIdFromName(name) {
  if (!name) return null;
  const key = String(name).toLowerCase().trim();
  return CASE_NAME_TO_ID[key] || null;
}

// ============================================================
// SHUFFLE helper (Fisher–Yates)
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// EMBEDDED sentence bank (fallback if sentences.json can't be loaded)
// ============================================================
const EMBEDDED_SENTENCES = [
  { level: 1, czech: "Rádi tančíme.", english: "We like to dance.", silentSubject: "my",
    tokens: [ { word: "Rádi tančíme", role: "Verb", case: null, subtype: null } ] },
  { level: 1, czech: "Včera nepracovali.", english: "Yesterday they didn't work.", silentSubject: "oni",
    tokens: [
      { word: "Včera", role: "Complement", case: null, subtype: "time" },
      { word: "nepracovali", role: "Verb", case: null, subtype: null } ] }
];

// ============================================================
// Constants
// ============================================================
const LABELS_BASE = ["Subject", "Verb", "DirectObject", "IndirectObject", "Complement", "Predicate"];
const SHORTCUT = {
  "Subject": "S", "Verb": "V", "DirectObject": "DO",
  "IndirectObject": "IO", "Complement": "C", "Predicate": "P"
};
const PERSON_OPTIONS = ["—", "já", "ty", "on", "ona", "ono", "my", "vy", "oni"];
const SKIP_PENALTY = 1;

// ============================================================
// Global state
// ============================================================
let SENTENCES = [];
let mode = null;
let groupKey = null;
let pool = [];              // shuffled working copy
let index = 0;
let score = 0;
let selectedLabel = null;
let assignments = [];
let caseAssignments = [];
let silentAnswer = "";
let checked = false;
let hintUsedThisQuestion = false;
let caseHintUsedThisQuestion = false;
let lastRenderGroup = null;
let notice = "";
let typingHelpSeenThisSession = false;
let notesVisible = false;
let caseNotesVisible = false;
let roleHintVisible = false;

// Shuffled label order for the current session (reshuffled on group pick).
let LABELS = LABELS_BASE.slice();

const app = document.getElementById("app");
const levelSel = document.getElementById("levelSel");

// ============================================================
// Group helpers
// ============================================================
function groupOf(s) {
  if (s.chapter !== undefined && s.chapter !== null) return "chapter:" + s.chapter;
  if (s.level   !== undefined && s.level   !== null) return "level:"   + s.level;
  return null;
}
function groupLabel(key) {
  const [type, n] = key.split(":");
  return type === "chapter" ? `Chapter ${n}` : `Level ${n}`;
}

// ============================================================
// Init
// ============================================================
async function init() {
  try {
    const res = await fetch("sentences.json", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data.sentences && data.sentences.length) SENTENCES = data.sentences;
    }
  } catch (e) { /* use embedded */ }
  if (!SENTENCES.length) SENTENCES = EMBEDDED_SENTENCES;

  buildDropdown();
  wireTopBar();
  render();
}

function buildDropdown() {
  const keys = new Set();
  for (const s of SENTENCES) {
    const k = groupOf(s);
    if (k) keys.add(k);
  }
  const sorted = [...keys].sort((a, b) => {
    const [ta, na] = a.split(":");
    const [tb, nb] = b.split(":");
    if (ta !== tb) return ta === "chapter" ? -1 : 1;
    return Number(na) - Number(nb);
  });
  levelSel.innerHTML = `<option value="">—</option>`;
  for (const k of sorted) {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = groupLabel(k);
    levelSel.appendChild(opt);
  }
  const allOpt = document.createElement("option");
  allOpt.value = "all";
  allOpt.textContent = "All";
  levelSel.appendChild(allOpt);
}

function wireTopBar() {
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.onclick = () => {
      const newMode = btn.dataset.mode;
      if (newMode === mode) return;
      mode = newMode;
      resetSentenceState();
      notice = `Mode: ${mode}.`;
      render();
    };
  });
  levelSel.onchange = () => {
    const v = levelSel.value;
    groupKey = v === "" ? null : v;
    if (groupKey !== null) {
      buildPool();
      // Reshuffle labels too, once per group selection
      LABELS = shuffle(LABELS_BASE);
      notice = groupKey === "all" ? "All sentences (shuffled)." : `${groupLabel(groupKey)} (shuffled).`;
      resetSentenceState();
    } else {
      pool = [];
      notice = "";
    }
    render();
  };
}

function buildPool() {
  let raw;
  if (groupKey === "all") raw = SENTENCES.slice();
  else raw = SENTENCES.filter(s => groupOf(s) === groupKey);
  // "All levels" -> one big shuffle; a specific chapter/level -> shuffle within it
  pool = shuffle(raw);
  index = 0;
}

function resetSentenceState() {
  assignments = [];
  caseAssignments = [];
  silentAnswer = "";
  checked = false;
  selectedLabel = null;
  hintUsedThisQuestion = false;
  caseHintUsedThisQuestion = false;
  lastRenderGroup = null;
  roleHintVisible = false;
  caseNotesVisible = false;
}

// ============================================================
// Render dispatcher
// ============================================================
function render() {
  updateModeButtons();
  if (!mode || groupKey === null) return renderWelcome();
  if (!pool.length) return renderEmptyPool();
  if (index >= pool.length) return renderDone();
  renderSentence();
}

function updateModeButtons() {
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });
  levelSel.value = groupKey === null ? "" : groupKey;
}

// ============================================================
// Welcome
// ============================================================
function renderWelcome() {
  app.innerHTML = `
    <div class="welcome">
      <h2>Welcome 👋</h2>
      <p>
        This exercise asks you to identify the <b>syntactic function</b> of every unit
        in a Czech sentence, and — when the unit has one — its <b>pád</b> (case).
        Pick a <b>mode</b> and a <b>chapter or level</b> at the top of the page.
        Sentences and labels are shuffled each time you pick a group.
      </p>

      <h3>Modes</h3>
      <ul>
        <li><b>Dumb</b> — English translation shown, tap labels onto units.</li>
        <li><b>Easy</b> — no English, tap labels onto units.</li>
        <li><b>Normal</b> — no English, type the shortcut under each unit.</li>
      </ul>

      <h3>Labels</h3>
      <ul>
        <li><b>Subject</b> — who or what does the action.</li>
        <li><b>Verb</b> — the action, or the copula <i>být</i> / <i>jmenovat se</i>.</li>
        <li><b>DirectObject</b> — what the action hits directly.</li>
        <li><b>IndirectObject</b> — the second object (often "to whom").</li>
        <li><b>Complement</b> — everything else (place, time, manner…).</li>
        <li><b>Predicate</b> — the word linked by a copula (<i>je profesor</i>, <i>je tady</i>, <i>jsem student</i>).</li>
      </ul>
      <p>In <b>Normal</b> mode, type the shortcuts:
        <code>S</code> <code>V</code> <code>DO</code> <code>IO</code> <code>C</code> <code>P</code>.</p>
      <p>In <b>Dumb</b> and <b>Easy</b> mode, click the label than the word.</p>

      <h3>Case (pád)</h3>
      <p>
        When a unit contains a noun, adjective, pronoun or ordinal number, a
        <b>case dropdown</b> appears above the word. Pick the correct <b>pád</b>
        from the seven Czech cases. Press <b>Case Hint</b> at any time for the
        full explanation — it costs 5 points.
      </p>

      <h3>Scoring</h3>
      <ul>
        <li>Correct role: <b>+1</b>. Wrong role: <b>−0.5</b>.</li>
        <li>Correct case: <b>+1</b>. Wrong case: <b>−0.5</b>.</li>
        <li><b>Hint</b> button: <b>−3</b> (role reminder).</li>
        <li><b>Case Hint</b> button: <b>−5</b> (case explanation).</li>
        <li><b>Skip</b> button: <b>−1</b>, jumps to the next sentence without scoring.</li>
        <li>If your score drops <b>below 0</b>, you jump back <b>3 sentences</b>.
            If there aren't 3 to fall back, you drop to the previous chapter or level.
            Skipping never triggers this.</li>
      </ul>

      <h3>Silent subject</h3>
      <p>
        Czech often drops the subject because the verb already tells you who it is.
        When all other units have labels and cases, a small yellow box appears asking
        you <b>who the verb implies</b> — or choose <b>—</b> if the sentence has an
        explicit subject or none at all.
      </p>

      <p class="big">Choose a mode and a chapter or level above to begin.</p>
    </div>
  `;
}

function renderEmptyPool() {
  app.innerHTML = `
    <div class="done">
      <h2>No sentences here yet.</h2>
      <p>Pick another chapter or level.</p>
    </div>`;
}

// ============================================================
// Sentence render
// ============================================================
function renderSentence() {
  const s = pool[index];
  const isTyping = mode === "Normal";

  if (assignments.length !== s.tokens.length || lastRenderGroup !== groupKey) {
    assignments = new Array(s.tokens.length).fill(isTyping ? "" : null);
    caseAssignments = s.tokens.map(t => t.case ? null : undefined);
    silentAnswer = "";
    checked = false;
    selectedLabel = null;
    hintUsedThisQuestion = false;
    caseHintUsedThisQuestion = false;
    lastRenderGroup = groupKey;
    roleHintVisible = false;
    caseNotesVisible = false;
  }

  const roleFilled = (a) => isTyping
    ? String(a || "").trim().length > 0
    : a !== null;
  const caseFilled = (c) => c === undefined ? true : c !== null;

  const allAssigned =
    assignments.every((a, i) => roleFilled(a) && caseFilled(caseAssignments[i]));

  const showSilentBox = allAssigned || checked;
  const silentCorrect = checked && silentMatches(silentAnswer, s.silentSubject);

  const showTypingHelp = isTyping && (!typingHelpSeenThisSession || hintUsedThisQuestion);
  if (isTyping && !typingHelpSeenThisSession) typingHelpSeenThisSession = true;

  const statusGroup = groupKey === "all" ? "All" : groupLabel(groupKey);
  const sentenceHasCase = s.tokens.some(t => t.case);

  app.innerHTML = `
    ${mode === "Dumb"
        ? `<div class="english">${escapeHtml(s.english || "")}</div>` : ""}

    <div class="status">
      <span>Sentence ${index + 1} / ${pool.length}
        &nbsp;·&nbsp; ${statusGroup}
        &nbsp;·&nbsp; Mode ${mode}</span>
      <span class="score ${score < 0 ? 'negative' : ''}">Score: ${score}</span>
    </div>

    ${showTypingHelp ? `
      <div class="explain">
        Type the shortcut under each word or phrase:
        <code>S</code> = Subject &nbsp;·&nbsp;
        <code>V</code> = Verb &nbsp;·&nbsp;
        <code>DO</code> = DirectObject &nbsp;·&nbsp;
        <code>IO</code> = IndirectObject &nbsp;·&nbsp;
        <code>C</code> = Complement &nbsp;·&nbsp;
        <code>P</code> = Predicate.
        Then pick a <b>pád</b> in the dropdown above any unit that has a case.
      </div>
    ` : ""}

    ${showSilentBox ? `
      <div class="silent-box ${checked ? (silentCorrect ? 'correct' : 'wrong') : ''}">
        <div class="q">Silent subject — who does the verb imply?</div>
        <div class="hint-text">
          ${isTyping
            ? "Type the person (já / ty / on / ona / ono / my / vy / oni) or — if there is none."
            : "Choose the person, or — if the sentence has an explicit subject or none at all."}
        </div>
        ${!checked
          ? (isTyping
              ? `<input type="text" id="silentInput" placeholder="ty / — / …" value="${escapeAttr(silentAnswer)}">`
              : `<select id="silentInput">
                   ${PERSON_OPTIONS.map(p =>
                     `<option ${silentAnswer === p ? "selected" : ""}>${p}</option>`).join("")}
                 </select>`)
          : `<div><b>${escapeHtml(silentAnswer || "—")}</b>${silentCorrect ? "" :
              ` &nbsp;→ correct: <b>${escapeHtml(s.silentSubject)}</b>`}</div>`}
      </div>
    ` : ""}

    ${!isTyping ? `
      <div class="labels" id="labels">
        ${LABELS.map(l => `
          <div class="label ${selectedLabel === l ? 'selected' : ''}"
               data-label="${l}">${l}</div>
        `).join("")}
      </div>
    ` : ""}

    <div class="sentence" id="sentence">
      ${s.tokens.map((t, i) => renderToken(s, t, i, isTyping)).join("")}
    </div>

    <div class="controls">
      <button class="speak" id="speakBtn">🔊 Listen</button>
      ${!checked
        ? `<button id="checkBtn" ${allAssigned ? "" : "disabled"}>Check</button>`
        : `<button id="nextBtn">Next →</button>`}
      <button class="hint ${hintUsedThisQuestion ? 'spent' : ''}" id="hintBtn">
        Hint ${hintUsedThisQuestion ? '(shown)' : '(−3)'}
      </button>
      <button class="case-hint ${caseHintUsedThisQuestion ? 'spent' : ''} ${sentenceHasCase ? '' : 'hidden'}" id="caseHintBtn">
        Case Hint ${caseHintUsedThisQuestion ? '(shown)' : '(−5)'}
      </button>
      <button class="notes" id="notesBtn">About Predicate</button>
      ${!checked
        ? `<span class="spacer"></span>
           <button class="skip" id="skipBtn" title="Skip this sentence without answering — costs 1 point">Skip (−1) →</button>`
        : ""}
    </div>

    ${notice ? `<div class="notice">${escapeHtml(notice)}</div>` : ""}

    <div id="roleReminder" class="${roleHintVisible ? '' : 'hidden'} role-reminder">
      <h4>Role labels — reminder</h4>
      <ul>
        <li><b>Subject</b> — who or what does the action. <code>S</code></li>
        <li><b>Verb</b> — the action, or the copula <i>být</i> / <i>jmenovat se</i>. <code>V</code></li>
        <li><b>DirectObject</b> — what the action hits directly. <code>DO</code></li>
        <li><b>IndirectObject</b> — the second object (often "to whom"). <code>IO</code></li>
        <li><b>Complement</b> — everything else (place, time, manner…). <code>C</code></li>
        <li><b>Predicate</b> — the word linked by a copula (<i>je profesor</i>, <i>je tady</i>). <code>P</code></li>
      </ul>
      <p>
        A unit can be several words together — a verb with its auxiliary or reflexive
        particle, a noun with its adjective. Label the whole unit as one.
      </p>
    </div>

    <div id="notesPanel" class="${notesVisible ? '' : 'hidden'} grammar-notes">
      <h4>About Predicate</h4>
      <p>
        Most Czech sentences have a <b>meaningful verb</b> — a verb that carries its own meaning:
      </p>
      <ul>
        <li><i>Petr <b>čte</b>.</i> (Petr reads.)</li>
        <li><i>Marie <b>tančí</b>.</i> (Marie dances.)</li>
        <li><i>Včera <b>nepracovali</b>.</i> (Yesterday they didn't work.)</li>
      </ul>
      <p>
        These are ordinary verbal sentences (<i>slovesné věty</i>) and they are the main type in Czech.
      </p>
      <p>
        A small number of verbs, however, have almost <b>no meaning of their own</b>. They only
        connect the subject with a word that describes or identifies it. The most common one is
        <i><b>být</b></i> (to be):
      </p>
      <ul>
        <li><i>Petr <b>je</b> profesor.</i> (Petr is a professor.)</li>
        <li><i>Marie <b>je</b> mladá.</i> (Marie is young.)</li>
        <li><i>Stůl <b>je</b> vpředu.</i> (The table is in front.)</li>
      </ul>
      <p>
        Here <i>je</i> doesn't mean "exists" or "lives" or anything — it just links. The word
        that follows carries the meaning. The verb <i>jmenovat se</i> (to be called) works the
        same way:
      </p>
      <ul>
        <li><i>Jmenuji se <b>Tomáš</b>.</i> (My name is Tomáš.)</li>
      </ul>
      <p>
        When a verb has lost its meaning like this, the whole phrase — the empty verb plus the
        describing word — forms a <b>predicate</b> (<i>přísudek</i>).
      </p>
      <p><b>How we use this in the exercise</b></p>
      <p>
        Czech teachers analyze <i>je profesor</i> as one unit. We split it for teaching.
        We want you to see the empty verb and the describing word separately:
      </p>
      <ul>
        <li><i><b>je</b></i> → <b>Verb</b></li>
        <li><i><b>profesor</b></i> → <b>Predicate</b></li>
      </ul>
      <p><b>When the Predicate button applies</b></p>
      <p>
        Only when the verb is <i>být</i> or another copula like <i>jmenovat se</i>. If the verb
        is a real verb — <i>čte</i>, <i>tančí</i>, <i>jde</i> — you label it as <b>Verb</b> and
        use Subject / Object / Complement as usual. The Predicate button stays unused.
      </p>
    </div>

    <div id="casePanel" class="${caseNotesVisible ? '' : 'hidden'} case-notes">
      <h4>O pádech v češtině</h4>
      <p>
        Czech nouns, adjectives, pronouns and ordinal numbers change their form depending on
        their role in the sentence. That change is called <b>pád</b> (case). Czech has seven
        cases, numbered 1 to 7:
      </p>
      <div class="case-line">
        <div class="case-name">1. pád — Kdo? Co?</div>
        <div>Subject of the sentence, and nominal predicate after <i>být</i>.</div>
        <div><i>Petr je <b>student</b>. / <b>Petr</b> čte.</i></div>
      </div>
      <div class="case-line">
        <div class="case-name">2. pád — Bez koho? Bez čeho?</div>
        <div>After prepositions <i>bez, do, od, kolem, z, u, vedle, blízko, kromě, podle, pomocí, během, včetně, místo</i>, and after quantity words (<i>kilo, litr, kousek, hodně, málo</i>).</div>
        <div><i>Jdu do <b>obchodu</b>. / kilo <b>cukru</b>.</i></div>
      </div>
      <div class="case-line">
        <div class="case-name">3. pád — Komu? Čemu?</div>
        <div>Indirect object, and after prepositions <i>k, proti, naprotu, díky, kvůli, vůči</i>.</div>
        <div><i>Dám to <b>bratrovi</b>.</i></div>
      </div>
      <div class="case-line">
        <div class="case-name">4. pád — Koho? Co?</div>
        <div>Direct object, and after prepositions <i>na, nad, mezi, po, pod, před, v, pro, za, o, přes, mimo, skrz, ob</i> when expressing motion or direction.</div>
        <div><i>Mám <b>knihu</b>. / Jdu na <b>poštu</b>.</i></div>
      </div>
      <div class="case-line">
        <div class="case-name">5. pád — Oslovujeme, voláme</div>
        <div>Used when addressing someone.</div>
        <div><i>Petře! / Jano!</i></div>
      </div>
      <div class="case-line">
        <div class="case-name">6. pád — O kom? O čem?</div>
        <div>Always after a preposition: <i>v, na, o, při, po</i>.</div>
        <div><i>Mluvíme o <b>Praze</b>. / Jsem v <b>parku</b>.</i></div>
      </div>
      <div class="case-line">
        <div class="case-name">7. pád — S kým? S čím?</div>
        <div>After prepositions <i>s, se, za, nad, pod, před, mezi</i>, and for means of transport or instrument.</div>
        <div><i>Jedu <b>autem</b>. / Jdu s <b>tebou</b>.</i></div>
      </div>
    </div>
  `;

  wireSentenceEvents(s, isTyping);
}

function renderToken(s, t, i, isTyping) {
  const a = assignments[i];
  const caseAssigned = caseAssignments[i];

  let slotClass = "";
  if (checked) {
    const roleCorrect = compareAnswer(a, t.role, isTyping);
    const caseCorrect = caseNeeded(t) ? (caseAssigned === caseIdFromName(t.case)) : true;
    slotClass = (roleCorrect && caseCorrect) ? "correct" : "wrong";
  } else if (isTyping ? (a && String(a).trim()) : a) {
    slotClass = "has-label";
  }

  const roleCorrection = (checked && !compareAnswer(a, t.role, isTyping))
    ? `<div class="correction">→ ${SHORTCUT[t.role]}</div>` : "";

  let caseBlock = "";
  if (caseNeeded(t)) {
    const correctId = caseIdFromName(t.case);
    let selClass = "case-select";
    if (checked) {
      selClass += caseAssigned === correctId ? " correct" : " wrong";
    } else if (caseAssigned === null) {
      selClass += " empty";
    }
    const disabled = checked ? "disabled" : "";
    caseBlock = `
      <select class="${selClass}" data-case-idx="${i}" ${disabled}>
        <option value="" ${caseAssigned === null ? "selected" : ""}>— pád —</option>
        ${CASES.map(c =>
          `<option value="${c.id}" ${caseAssigned === c.id ? "selected" : ""}>${c.label}</option>`
        ).join("")}
      </select>
      ${checked && caseAssigned !== correctId
          ? `<div class="case-correction">→ ${CASES.find(c => c.id === correctId).label}</div>`
          : ""}
    `;
  }

  if (isTyping) {
    return `
      <div class="word-slot ${slotClass}" data-idx="${i}">
        <input class="slot-input" data-idx="${i}" maxlength="2" placeholder="?"
               value="${escapeAttr(a || "")}" ${checked ? "disabled" : ""}>
        ${caseBlock}
        <div class="word">${escapeHtml(t.word)}</div>
        ${roleCorrection}
      </div>`;
  }
  return `
    <div class="word-slot ${slotClass}" data-idx="${i}">
      <div class="slot-label ${a ? '' : 'empty'}">${a || '—'}</div>
      ${caseBlock}
      <div class="word">${escapeHtml(t.word)}</div>
      ${roleCorrection}
    </div>`;
}

function caseNeeded(t) {
  return t.case !== undefined && t.case !== null;
}

function wireSentenceEvents(s, isTyping) {
  document.getElementById("speakBtn").onclick = speak;

  document.getElementById("hintBtn").onclick = () => {
    if (!hintUsedThisQuestion) { score -= 3; hintUsedThisQuestion = true; }
    roleHintVisible = true;
    renderSentence();
    updateScoreDisplay();
    const panel = document.getElementById("roleReminder");
    if (panel) panel.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const caseHintBtn = document.getElementById("caseHintBtn");
  if (caseHintBtn) {
    caseHintBtn.onclick = () => {
      if (!caseHintUsedThisQuestion) { score -= 5; caseHintUsedThisQuestion = true; }
      caseNotesVisible = true;
      renderSentence();
      updateScoreDisplay();
      const panel = document.getElementById("casePanel");
      if (panel) panel.scrollIntoView({ behavior: "smooth", block: "center" });
    };
  }

  document.getElementById("notesBtn").onclick = () => {
    notesVisible = !notesVisible;
    const panel = document.getElementById("notesPanel");
    if (panel) panel.classList.toggle("hidden", !notesVisible);
  };

  const skipBtn = document.getElementById("skipBtn");
  if (skipBtn) {
    skipBtn.onclick = () => {
      score -= SKIP_PENALTY;
      updateScoreDisplay();
      index += 1;
      resetSentenceState();
      notice = "";
      render();
    };
  }

  if (!checked) {
    if (isTyping) {
      document.querySelectorAll(".slot-input").forEach(inp => {
        inp.oninput = e => {
          const i = Number(e.target.dataset.idx);
          assignments[i] =
            e.target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 2);
          const caret = e.target.selectionStart;
          renderSentence();
          const same = document.querySelector(`.slot-input[data-idx="${i}"]`);
          if (same) {
            same.focus();
            try { same.setSelectionRange(caret, caret); } catch (_) {}
          }
        };
        inp.onkeydown = e => {
          if (e.key === "Enter" && allAssignedNow(isTyping)) check(s, isTyping);
        };
      });
    } else {
      document.querySelectorAll(".label").forEach(el => {
        el.onclick = () => { selectedLabel = el.dataset.label; renderSentence(); };
      });
      document.querySelectorAll(".word-slot").forEach(el => {
        el.onclick = (ev) => {
          if (ev.target.closest(".case-select")) return;
          if (!selectedLabel) return;
          assignments[Number(el.dataset.idx)] = selectedLabel;
          renderSentence();
        };
      });
    }

    document.querySelectorAll(".case-select").forEach(sel => {
      sel.onchange = e => {
        const i = Number(e.target.dataset.caseIdx);
        const v = e.target.value;
        caseAssignments[i] = v === "" ? null : Number(v);
        renderSentence();
      };
    });

    const cb = document.getElementById("checkBtn");
    if (cb) cb.onclick = () => check(s, isTyping);

    const si = document.getElementById("silentInput");
    if (si) {
      if (isTyping) si.oninput = e => { silentAnswer = e.target.value; };
      else          si.onchange = e => { silentAnswer = e.target.value; };
    }
  } else {
    document.getElementById("nextBtn").onclick = next;
  }
}

function allAssignedNow(isTyping) {
  const rolesOk = isTyping
    ? assignments.every(a => String(a || "").trim().length > 0)
    : assignments.every(a => a !== null);
  const casesOk = caseAssignments.every(c => c === undefined || c !== null);
  return rolesOk && casesOk;
}

function updateScoreDisplay() {
  const el = document.querySelector(".score");
  if (!el) return;
  el.textContent = `Score: ${score}`;
  el.classList.toggle("negative", score < 0);
}

// ============================================================
// Actions
// ============================================================
function speak() {
  const s = pool[index];
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(s.czech);
  u.lang = "cs-CZ"; u.rate = 0.9;
  speechSynthesis.speak(u);
}

function compareAnswer(given, correctRole, isTyping) {
  if (isTyping) {
    const g = String(given || "").trim().toUpperCase();
    return g === SHORTCUT[correctRole];
  }
  return given === correctRole;
}

function check(s, isTyping) {
  let delta = 0;
  s.tokens.forEach((t, i) => {
    delta += compareAnswer(assignments[i], t.role, isTyping) ? 1 : -0.5;
    if (caseNeeded(t)) {
      const correctId = caseIdFromName(t.case);
      delta += (caseAssignments[i] === correctId) ? 1 : -0.5;
    }
  });
  const silentOK = silentMatches(silentAnswer, s.silentSubject);
  delta += silentOK ? 1 : -0.5;
  score += delta;
  checked = true;

  if (score < 0) return handleBounce();
  renderSentence();
}

function handleBounce() {
  const back = 3;
  let newIndex = index - back;
  let newGroup = groupKey;

  if (newIndex < 0) {
    const allGroupKeys = [...levelSel.options]
      .map(o => o.value)
      .filter(v => v && v !== "" && v !== "all");
    const currentPos = allGroupKeys.indexOf(groupKey);

    if (groupKey === "all" || currentPos <= 0) {
      newIndex = 0;
    } else {
      newGroup = allGroupKeys[currentPos - 1];
      let raw = SENTENCES.filter(s => groupOf(s) === newGroup);
      pool = shuffle(raw);
      newIndex = Math.max(0, pool.length - 1);
    }
  }

  const noticeText = (newIndex === index && newGroup === groupKey)
    ? `Score below 0 — nowhere further back, staying here.`
    : `Score below 0 — going back 3 sentences${newGroup !== groupKey ? ` to ${groupLabel(newGroup)}` : ""}.`;

  renderSentence();
  const div = document.createElement("div");
  div.className = "bounce";
  div.textContent = noticeText;
  document.querySelector(".controls").after(div);

  setTimeout(() => {
    if (newGroup !== groupKey) { groupKey = newGroup; levelSel.value = groupKey; }
    index = newIndex;
    score = 0;
    resetSentenceState();
    notice = "";
    render();
  }, 1800);
}

function next() {
  index += 1;
  resetSentenceState();
  notice = "";
  render();
}

// ============================================================
// Done
// ============================================================
function renderDone() {
  const statusGroup = groupKey === "all" ? "All" : groupLabel(groupKey);
  app.innerHTML = `
    <div class="done">
      <h2>Done! 🎉</h2>
      <div class="final">${score} points</div>
      <p>You finished all ${pool.length} sentences of ${statusGroup} in ${mode} mode.</p>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;">
        <button id="againSame" class="secondary">Repeat (reshuffle)</button>
        <button id="startOver">Start again (reset score)</button>
      </div>
    </div>`;
  document.getElementById("againSame").onclick = () => {
    pool = shuffle(pool);
    index = 0;
    LABELS = shuffle(LABELS_BASE);
    resetSentenceState();
    notice = "";
    render();
  };
  document.getElementById("startOver").onclick = () => {
    score = 0;
    buildPool();
    LABELS = shuffle(LABELS_BASE);
    resetSentenceState();
    notice = "";
    render();
  };
}

// ============================================================
// Helpers
// ============================================================
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function normalizeSilent(s) {
  return String(s || "").trim().toLowerCase()
    .replace(/[áàâ]/g, "a").replace(/[éèê]/g, "e")
    .replace(/[íìî]/g, "i").replace(/[óòô]/g, "o")
    .replace(/[úùûů]/g, "u").replace(/[ýỳ]/g, "y")
    .replace(/[č]/g, "c").replace(/[ř]/g, "r")
    .replace(/[š]/g, "s").replace(/[ž]/g, "z")
    .replace(/[ď]/g, "d").replace(/[ť]/g, "t")
    .replace(/[ň]/g, "n");
}
function silentMatches(given, expected) {
  const g = normalizeSilent(given);
  const e = normalizeSilent(expected);
  if (e === "—" || e === "-") return g === "—" || g === "-" || g === "";
  return g === e;
}

// ============================================================
// Go
// ============================================================
init();
</script>
</body>
</html>
